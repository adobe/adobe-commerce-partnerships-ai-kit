name: Track Traffic Statistics

on:
  schedule:
    # Runs automatically every day at 00:00 UTC
    - cron: '0 0 * * *'
  # Allows you to trigger the action manually from the Actions tab anytime
  workflow_dispatch:

jobs:
  update-traffic-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch and Record Traffic Data
        env:
          TRAFFIC_PAT: ${{ secrets.TRAFFIC_PAT }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p traffic_data

          # Fetch raw JSON responses from GitHub Traffic API
          VIEWS_JSON=$(curl -s -H "Authorization: token $TRAFFIC_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/traffic/views")

          CLONES_JSON=$(curl -s -H "Authorization: token $TRAFFIC_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/traffic/clones")

          # --- Process Views ---
          if [ ! -f traffic_data/views.csv ]; then
            echo "timestamp,count,uniques" > traffic_data/views.csv
          fi

          echo "$VIEWS_JSON" | jq -r '.views[]? | "\(.timestamp),\(.count),\(.uniques)"' | while read -r line; do
            if [ -n "$line" ]; then
              TIMESTAMP=$(echo "$line" | cut -d',' -f1)
              # Avoid duplicates by removing existing entry for the same timestamp before appending
              grep -v "^$TIMESTAMP" traffic_data/views.csv > traffic_data/views.tmp || true
              mv traffic_data/views.tmp traffic_data/views.csv
              echo "$line" >> traffic_data/views.csv
            fi
          done

          # --- Process Clones ---
          if [ ! -f traffic_data/clones.csv ]; then
            echo "timestamp,count,uniques" > traffic_data/clones.csv
          fi

          echo "$CLONES_JSON" | jq -r '.clones[]? | "\(.timestamp),\(.count),\(.uniques)"' | while read -r line; do
            if [ -n "$line" ]; then
              TIMESTAMP=$(echo "$line" | cut -d',' -f1)
              grep -v "^$TIMESTAMP" traffic_data/clones.csv > traffic_data/clones.tmp || true
              mv traffic_data/clones.tmp traffic_data/clones.csv
              echo "$line" >> traffic_data/clones.csv
            fi
          done

          # Sort CSV files by timestamp (keeping header intact)
          head -n 1 traffic_data/views.csv > traffic_data/views_sorted.csv
          tail -n +2 traffic_data/views.csv | sort >> traffic_data/views_sorted.csv
          mv traffic_data/views_sorted.csv traffic_data/views.csv

          head -n 1 traffic_data/clones.csv > traffic_data/clones_sorted.csv
          tail -n +2 traffic_data/clones.csv | sort >> traffic_data/clones_sorted.csv
          mv traffic_data/clones_sorted.csv traffic_data/clones.csv

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic_data/
          
          # Only commit if there are actual changes
          if ! git diff --quiet --staged; then
            git commit -m "chore: update repository traffic statistics [skip ci]"
            git push
          else
            echo "No new traffic data to commit."
          fi